name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: Vercel ${{ github.event_name == 'push' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Skip when Vercel secrets are not set
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Vercel secrets are not configured; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build and deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          npx --yes vercel@latest pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          if [ "$TARGET" = "production" ]; then
            npx vercel build --prod --token="$VERCEL_TOKEN"
            url=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            npx vercel build --token="$VERCEL_TOKEN"
            url=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
