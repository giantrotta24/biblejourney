name: Daily reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    name: Send due reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDERS_URL: ${{ vars.REMINDERS_URL }}
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the reminder route
        run: |
          if { [ -z "$REMINDERS_URL" ] && [ -z "$APP_URL" ]; } || [ -z "$CRON_SECRET" ]; then
            echo "Neither REMINDERS_URL nor APP_URL is set, or CRON_SECRET is missing; skipping."
            exit 0
          fi
          endpoint="${REMINDERS_URL:-${APP_URL%/}/api/reminders/send}"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$endpoint"
